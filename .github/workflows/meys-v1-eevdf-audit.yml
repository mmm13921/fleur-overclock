name: Meys V1 EEVDF 6.18 source audit
on:
  push:
    branches:
      - meys-v1-eevdf
    paths:
      - '.github/workflows/meys-v1-eevdf-audit.yml'
      - 'eevdf/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Meys build repository
        uses: actions/checkout@v4
      - name: Fetch pinned V11 kernel source
        run: git clone --depth=1 --branch v11 https://gitlab.com/daliboss/fleux.git kernel-src
      - name: Audit existing EEVDF and Linux 6.18 extensions
        run: |
          set -euo pipefail
          python3 eevdf/audit_eevdf_618.py kernel-src | tee artifacts-eevdf-audit.txt
          grep -q '^core_eevdf=PASS$' artifacts-eevdf-audit.txt
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: meys-v1-eevdf-source-audit
          path: artifacts-eevdf-audit.txt
          if-no-files-found: error
          retention-days: 30
