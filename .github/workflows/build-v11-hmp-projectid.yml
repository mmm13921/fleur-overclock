name: Meys ProjectID 30 + EEVDF + Modem PM
run-name: Meys patched-8 + F2FS ProjectID inode persistence audit (${{ github.event_name }})
on:
  push:
    branches:
      - meys-projectid-30-eevdf-modem
      - test/meys-patched-8-android-data-fix
    paths:
      - '.github/workflows/build-v11-hmp-projectid.yml'
      - 'scripts/build_kernel.sh'
      - 'scripts/apply_modem_pm_compat.py'
      - 'eevdf/**'
      - 'scripts/apply_f2fs_projectid_compat.py'
      - 'patches/apply/0002-f2fs-projectid-metadata-compat.py'
      - 'scripts/apply_scheduler_modes.py'
      - 'scripts/apply_official_419191_fs_mount.py'
      - 'scripts/anykernel_meys_v1_eevdf.sh'
      - 'research/android13-mediaprovider/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meys-projectid-30-eevdf-modem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-package:
    name: Build Meys patched-8 + F2FS ProjectID inode persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: v11
      BUILD_PROFILE: meys-projectid-30-eevdf-modem
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
      - name: Apply and audit Android 13 MediaProvider FUSE bridge
        run: |
          set -euo pipefail
          python3 -m py_compile research/android13-mediaprovider/apply_projectid_ioctl_bridge.py
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          git clone --depth=1 --branch android13-security-release \
            https://android.googlesource.com/platform/packages/providers/MediaProvider \
            "$RUNNER_TEMP/MediaProvider"
          python3 "$GITHUB_WORKSPACE/research/android13-mediaprovider/apply_projectid_ioctl_bridge.py" "$RUNNER_TEMP/MediaProvider"
          git -C "$RUNNER_TEMP/MediaProvider" diff --check
          grep -q 'static void pf_projectid_ioctl' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          grep -q '.ioctl = pf_projectid_ioctl' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          grep -q 'FS_IOC_FSGETXATTR' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          grep -q 'FS_IOC_FSSETXATTR' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          git -C "$RUNNER_TEMP/MediaProvider" diff -- jni/FuseDaemon.cpp > "$GITHUB_WORKSPACE/artifacts/android13-mediaprovider-projectid.patch"
          test -s "$GITHUB_WORKSPACE/artifacts/android13-mediaprovider-projectid.patch"
          echo "Android 13 AOSP source transformation and diff checks passed."
      - name: Check builder shell syntax
        run: bash -n scripts/build_kernel.sh
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 python3-pip dwarves zip unzip
      - name: Install checksum-verified Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"
      - name: Build Meys from pinned upstream kernel source
        run: bash scripts/build_kernel.sh "$SOURCE_REF" "$BUILD_PROFILE"
      - name: Package AnyKernel3 test ZIP
        env:
          AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK_DIR="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK_DIR"
          git -C "$AK_DIR" init
          git -C "$AK_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          cp scripts/anykernel_meys_v1_eevdf.sh "$AK_DIR/anykernel.sh"
          cp README.md "$AK_DIR/README.md"
          cp README.md artifacts/README.md
          cp artifacts/Image.gz-dtb "$AK_DIR/Image.gz-dtb"
          cp artifacts/kernel.config "$AK_DIR/kernel.config"
          cp artifacts/build-manifest.txt "$AK_DIR/build-manifest.txt"
          cp artifacts/hmp-storage-projectid-source.patch "$AK_DIR/hmp-storage-projectid-source.patch"
          cp artifacts/storage-projectid-audit.txt "$AK_DIR/storage-projectid-audit.txt"
          cp artifacts/projectid-compatibility-audit.txt "$AK_DIR/projectid-compatibility-audit.txt"
          cp artifacts/scheduler-modes-audit.txt "$AK_DIR/scheduler-modes-audit.txt"
          cp artifacts/modem-pm-audit.txt "$AK_DIR/modem-pm-audit.txt"
          cp artifacts/eevdf-layer1-audit.txt "$AK_DIR/eevdf-layer1-audit.txt"
          cp artifacts/eevdf-audit.txt "$AK_DIR/eevdf-audit.txt"
          cp artifacts/official-4.19.191-fs-mount-audit.txt "$AK_DIR/official-4.19.191-fs-mount-audit.txt"
          cp artifacts/android-storage-audit.txt "$AK_DIR/android-storage-audit.txt"
          cp research/android13-mediaprovider/README.md artifacts/ANDROID13-MEDIAPROVIDER-README.md
          (
            cd "$AK_DIR"
            zip -r9 "$GITHUB_WORKSPACE/artifacts/Meys-V1-EEVDF-Modem-AnyKernel3.zip" \
              META-INF tools LICENSE README.md anykernel.sh Image.gz-dtb kernel.config \
              build-manifest.txt hmp-storage-projectid-source.patch \
              storage-projectid-audit.txt projectid-compatibility-audit.txt scheduler-modes-audit.txt \
              official-4.19.191-fs-mount-audit.txt android-storage-audit.txt \
              modem-pm-audit.txt eevdf-layer1-audit.txt eevdf-audit.txt
          )
          unzip -t "$GITHUB_WORKSPACE/artifacts/Meys-V1-EEVDF-Modem-AnyKernel3.zip"
          sha256sum "$GITHUB_WORKSPACE/artifacts/Meys-V1-EEVDF-Modem-AnyKernel3.zip" | tee artifacts/MEYS-PROJECTID-SHA256.txt
      - name: Upload Meys kernel, AnyKernel ZIP, and source audits
        uses: actions/upload-artifact@v4
        with:
          name: meys-projectid-30-eevdf-modem-mt6781
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish Meys experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'test/meys-patched-8-android-data-fix' && format('meys-patched-8-storage-test-{0}', github.run_number) || format('meys-projectid-30-eevdf-modem-{0}', github.run_number) }}
          name: ${{ github.ref_name == 'test/meys-patched-8-android-data-fix' && format('Meys patched-8 Android data test — build {0}', github.run_number) || format('Meys ProjectID 30 + EEVDF + Modem PM — build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name == 'test/meys-patched-8-android-data-fix' }}
          make_latest: ${{ github.ref_name != 'test/meys-patched-8-android-data-fix' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Based on [Fleux Kernel](https://github.com/daliboss/Fleux) by [daliboss](https://github.com/daliboss).

            Meys experimental MT6781 kernel based on the meys-projectid-30 release baseline. Filesystem, F2FS and Project ID source patch set are preserved unchanged. The upstream V11 source repository is retained only as the technical source base.

            Includes the HMP/EAS/Hybrid CPU mode selector (HMP default) and
            the native F2FS Project ID implementation backported from Xiaomi
            sea-t-oss 4.19.191, including inode project-ID persistence, quota
            transfer and project inheritance. Real project quota still
            requires compatible on-disk EXTRA_ATTR and PRJQUOTA features.

            Includes the first Linux 6.18 EEVDF semantic backport layer and MT6781 DPMAIF syscore PM safety guard. EEVDF DELAY_DEQUEUE/DELAY_ZERO are not included; the modem change is not a full 4.14 modem driver port.

            Includes a guarded legacy-userdata F2FS Project ID compatibility path: preserve native quota transfer when PRJQUOTA and EXTRA_ATTR exist; persist project IDs when EXTRA_ATTR exists without PRJQUOTA; return success without persistence only when legacy userdata cannot store project IDs. No userdata format or superblock feature mutation is performed.

            The Android 13 MediaProvider FUSE ioctl bridge source patch is
            included as a separate release asset and validated for clean
            application to the pinned AOSP Android 13 branch. It is NOT built
            into this kernel ZIP or a flashable APK. It still requires a full
            Android 13 MediaProvider build and validation against Xiaomi's ROM.
            Kernel ZIP remains a kernel-side test. Preserve a known-good boot image.
          files: |
            artifacts/README.md
            artifacts/Meys-V1-EEVDF-Modem-AnyKernel3.zip
            artifacts/hmp-storage-projectid-source.patch
            artifacts/storage-projectid-audit.txt
            artifacts/projectid-compatibility-audit.txt
            artifacts/scheduler-modes-audit.txt
            artifacts/official-4.19.191-fs-mount-audit.txt
            artifacts/android-storage-audit.txt
            artifacts/android13-mediaprovider-projectid.patch
            artifacts/ANDROID13-MEDIAPROVIDER-README.md
            artifacts/build-manifest.txt
            artifacts/MEYS-PROJECTID-SHA256.txt
            artifacts/modem-pm-audit.txt
            artifacts/eevdf-layer1-audit.txt
            artifacts/eevdf-audit.txt
