name: Fleur patched baseline kernel build
run-name: Fleur baseline with mods_all.py (push)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-baseline-patched.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fleux upstream branch or tag
        required: true
        default: lineage-24.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and validate patched baseline kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'lineage-24.0' }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
      - name: Validate patch script syntax
        run: python3 -m py_compile patches/mods_all.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 python3-pip dwarves
      - name: Install Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"
      - name: Build Fleur baseline and apply validated mods
        run: bash scripts/build_kernel.sh "$SOURCE_REF" baseline
      - name: Verify final image and required patch log
        run: |
          set -euo pipefail
          test -s artifacts/Image.gz-dtb
          test -s artifacts/mods-all-patch.log
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib
          raw = Path("artifacts/Image.gz-dtb").read_bytes()
          assert raw[:2] == bytes.fromhex("1f8b"), "Image.gz-dtb does not start with a gzip kernel payload"
          decoder = zlib.decompressobj(31)
          kernel = decoder.decompress(raw)
          dtb = decoder.unused_data
          assert decoder.eof, "gzip kernel stream is incomplete"
          assert kernel, "decompressed kernel payload is empty"
          assert dtb.startswith(bytes.fromhex("d00dfeed")), "appended DTB magic is missing"
          assert len(dtb) >= 40, "appended DTB header is truncated"
          dtb_total = struct.unpack_from(">I", dtb, 4)[0]
          assert 40 <= dtb_total <= len(dtb), f"invalid DTB totalsize: {dtb_total}, available: {len(dtb)}"
          print(f"Final image validated: gzip_kernel={len(kernel)} bytes, dtb_total={dtb_total} bytes, dtb_tail={len(dtb)} bytes")
          PY
          sha256sum artifacts/Image.gz-dtb | tee artifacts/Image.gz-dtb.sha256
      - name: Upload kernel artifacts and patch report
        uses: actions/upload-artifact@v4
        with:
          name: fleur-baseline-patched-mods-all
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
