name: Meys Build 30 data storage fix only
run-name: Meys Build 30 F2FS Project ID persistence fix
on:
  push:
    branches: [meys-vx-v17-build30-eevdf618-modemaudit]
    paths:
      - '.github/workflows/build-build30-data-storage-fix.yml'
      - 'scripts/build_kernel.sh'
      - 'scripts/apply_f2fs_projectid_compat.py'
      - 'scripts/audit_android_storage.py'
      - 'scripts/apply_official_419191_fs_mount.py'
      - 'patches/apply/0002-f2fs-projectid-metadata-compat.py'
      - 'scripts/configure_hyperos_fs.sh'
      - 'scripts/anykernel_storage_projectid.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meys-build30-data-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_BASELINE: Build30
      SOURCE_REF: v11
      BUILD_PROFILE: data-storage-only
    steps:
      - name: Check out Build 30 data-only builder
        uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ca-certificates curl flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev lld make python3 dwarves zip unzip
      - name: Install checksum-verified Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"
      - name: Validate data-only patch scripts
        run: |
          set -euo pipefail
          bash -n scripts/build_kernel.sh scripts/configure_hyperos_fs.sh
          python3 -m py_compile scripts/apply_official_419191_fs_mount.py scripts/apply_f2fs_projectid_compat.py scripts/audit_android_storage.py patches/apply/0002-f2fs-projectid-metadata-compat.py
      - name: Build from immutable Build 30 baseline with storage fixes only
        run: bash scripts/build_kernel.sh "$SOURCE_REF" "$BUILD_PROFILE"
      - name: Package isolated F2FS Project ID AnyKernel3 ZIP
        env:
          AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK_DIR="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK_DIR"
          git -C "$AK_DIR" init
          git -C "$AK_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          cp scripts/anykernel_storage_projectid.sh "$AK_DIR/anykernel.sh"
          cp artifacts/Image.gz-dtb artifacts/kernel.config artifacts/build-manifest.txt "$AK_DIR/"
          cp artifacts/data-storage-only-source.patch artifacts/storage-projectid-audit.txt "$AK_DIR/"
          cp artifacts/official-4.19.191-fs-mount-audit.txt artifacts/android-storage-audit.txt "$AK_DIR/"
          (
            cd "$AK_DIR"
            zip -r9 "$GITHUB_WORKSPACE/artifacts/Meys-Build30-Data-Storage-Fix-AnyKernel3.zip" META-INF tools LICENSE anykernel.sh Image.gz-dtb kernel.config build-manifest.txt data-storage-only-source.patch storage-projectid-audit.txt official-4.19.191-fs-mount-audit.txt android-storage-audit.txt
          )
          unzip -t "$GITHUB_WORKSPACE/artifacts/Meys-Build30-Data-Storage-Fix-AnyKernel3.zip"
          sha256sum artifacts/Meys-Build30-Data-Storage-Fix-AnyKernel3.zip | tee artifacts/DATA-STORAGE-SHA256.txt
      - name: Upload data-only kernel and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: meys-build30-data-storage-fix-mt6781
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
