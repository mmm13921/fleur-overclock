name: Build CPU Assembly Test APK
on:
  workflow_dispatch:
  push:
    branches: [ cpu-assembly-test ]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-cpu-assembly.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build arm64 APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-assembly-test-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
