name: Clean up old branches and workflow runs

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Perform deletions (false = dry run)"
        required: true
        type: boolean
        default: false
      delete_failed_runs:
        description: "Delete failed, cancelled, timed-out, skipped, stale, and unstarted workflow runs"
        required: true
        type: boolean
        default: true
      delete_unstarted_runs:
        description: "Delete queued, requested, waiting, and pending workflow runs"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clean old branches and unwanted workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXECUTE: ${{ inputs.execute }}
          DELETE_FAILED_RUNS: ${{ inputs.delete_failed_runs }}
          DELETE_UNSTARTED_RUNS: ${{ inputs.delete_unstarted_runs }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_BRANCHES=(
            "main"
            "meys-vx-v16-modem-sea419191"
            "meys-vx-v15-modem414-eevdf618"
            "meys-vx-v14-modem-4.14"
            "meys-vx-v13-eevdf-6.18-fleux-4.14"
          )

          DEFAULT_BRANCH="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          echo "Default branch: $DEFAULT_BRANCH"
          echo "Execution mode: $([[ "$EXECUTE" == "true" ]] && echo DELETE || echo DRY-RUN)"

          echo "::group::Branch cleanup"
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            keep=false
            for allowed in "${KEEP_BRANCHES[@]}"; do
              [[ "$branch" == "$allowed" ]] && keep=true
            done
            [[ "$branch" == "$DEFAULT_BRANCH" ]] && keep=true

            if [[ "$keep" == "true" ]]; then
              echo "KEEP: $branch"
            elif [[ "$EXECUTE" != "true" ]]; then
              echo "WOULD DELETE BRANCH: $branch"
            else
              encoded_branch="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
              if gh api --silent --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded_branch"; then
                echo "DELETED BRANCH: $branch"
              else
                echo "::warning::Could not delete branch: $branch"
              fi
            fi
          done < <(gh api --paginate "repos/$REPOSITORY/branches?per_page=100" --jq '.[].name')
          echo "::endgroup::"

          if [[ "$DELETE_FAILED_RUNS" == "true" || "$DELETE_UNSTARTED_RUNS" == "true" ]]; then
            echo "::group::Workflow run cleanup"
            while IFS=$'\t' read -r run_id run_name run_status conclusion; do
              [[ -z "$run_id" ]] && continue
              [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue

              remove=false
              if [[ "$DELETE_FAILED_RUNS" == "true" ]]; then
                case "$conclusion" in
                  failure|timed_out|cancelled|action_required|startup_failure|stale|skipped|neutral)
                    remove=true
                    ;;
                esac
              fi
              if [[ "$DELETE_UNSTARTED_RUNS" == "true" ]]; then
                case "$run_status" in
                  queued|requested|waiting|pending)
                    remove=true
                    ;;
                esac
              fi

              [[ "$remove" == "true" ]] || continue
              if [[ "$EXECUTE" != "true" ]]; then
                echo "WOULD DELETE RUN: id=$run_id name=$run_name status=$run_status conclusion=$conclusion"
              elif gh api --silent --method DELETE "repos/$REPOSITORY/actions/runs/$run_id"; then
                echo "DELETED RUN: id=$run_id name=$run_name status=$run_status conclusion=$conclusion"
              else
                echo "::warning::Could not delete workflow run: $run_id ($run_name)"
              fi
            done < <(gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, .name, .status, (.conclusion // "-")] | @tsv')
            echo "::endgroup::"
          else
            echo "Workflow run cleanup was not selected."
          fi

          echo "Cleanup completed."
