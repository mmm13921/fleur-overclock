name: Clean failed and unstarted workflow runs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-old-workflow-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-successful or unstarted run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const keep = [];
            const remove = [];
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const run of runs) {
              if (run.id === currentRunId) continue;
              if (run.conclusion === 'success') {
                keep.push(run.id);
                continue;
              }
              if (
                run.status === 'completed' ||
                ['queued', 'requested', 'waiting', 'pending'].includes(run.status)
              ) {
                remove.push(run);
              }
            }
            core.info(`Found ${runs.length} runs; keeping ${keep.length} successful runs; deleting ${remove.length} unsuccessful/unstarted runs.`);
            let deleted = 0;
            for (const run of remove) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted run ${run.id}: ${run.name} (#${run.run_number}), status=${run.status}, conclusion=${run.conclusion}`);
              } catch (error) {
                core.warning(`Could not delete run ${run.id}: ${error.message}`);
              }
            }
            core.info(`Deletion completed: ${deleted}/${remove.length}; successful runs retained: ${keep.length}.`);
