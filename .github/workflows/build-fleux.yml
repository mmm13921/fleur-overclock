name: Fleux latest-source kernel build (cgroup v2)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-fleux.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fleux upstream branch or tag; lineage-24.0 tracks the current source
        required: true
        default: lineage-24.0
        type: string

permissions:
  contents: read

concurrency:
  group: fleux-kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build fleur_defconfig with cgroup v2
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'lineage-24.0' }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Validate source ref
        shell: bash
        run: |
          case "$SOURCE_REF" in
            v∞)
              ;;
            ""|-*|*..*|*//*|*[!A-Za-z0-9._/-]*)
              echo "Invalid source ref: $SOURCE_REF" >&2
              exit 2
              ;;
          esac

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 python3-pip dwarves

      - name: Install Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"

      - name: Build Fleux kernel with cgroup v2 support
        run: bash scripts/build_kernel.sh "$SOURCE_REF"

      - name: Upload kernel image and cgroup v2 manifest
        uses: actions/upload-artifact@v4
        with:
          name: fleux-cgroup-v2
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
