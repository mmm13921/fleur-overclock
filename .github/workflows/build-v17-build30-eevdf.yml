name: Meys Build 30 EEVDF 6.18 layer 1 + modem PM guard
run-name: Meys Build 30 patched EEVDF build (${{ github.event_name }})
on:
  push:
    branches: [meys-vx-build30-storagefix-eevdf618-modem]
    paths:
      - '.github/workflows/build-v17-build30-eevdf.yml'
      - 'scripts/build_kernel.sh'
      - 'scripts/apply_modem_pm_compat.py'
      - 'scripts/audit_modem_stack.py'
      - 'scripts/anykernel_build30_eevdf.sh'
      - 'scripts/apply_*.py'
      - 'scripts/configure_*.sh'
      - 'scripts/audit_android_storage.py'
      - 'patches/apply/**'
      - 'research/android13-mediaprovider/**'
      - 'eevdf/**'
      - 'docs/modem-pm-port.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meys-build30-eevdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_BASELINE: Build30
      SOURCE_REF: v11
      BUILD_PROFILE: meys-v1-eevdf
    steps:
      - name: Check out Build 30 based builder
        uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ca-certificates curl flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev lld make python3 python3-pip dwarves zip unzip
      - name: Install checksum-verified Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"
      - name: Validate all Build 30 patch and helper scripts
        run: |
          set -euo pipefail
          bash -n scripts/build_kernel.sh scripts/configure_cgroup_v2.sh scripts/configure_hyperos_fs.sh
          python3 -m compileall -q scripts eevdf research/android13-mediaprovider
      - name: Generate and validate Android 13 MediaProvider ioctl bridge source patch
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone --depth=1 --branch android13-security-release https://android.googlesource.com/platform/packages/providers/MediaProvider "$RUNNER_TEMP/MediaProvider"
          python3 research/android13-mediaprovider/apply_projectid_ioctl_bridge.py "$RUNNER_TEMP/MediaProvider"
          git -C "$RUNNER_TEMP/MediaProvider" diff --check
          grep -q 'static void pf_projectid_ioctl' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          grep -q '.ioctl = pf_projectid_ioctl' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          grep -q 'FS_IOC_FSGETXATTR' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          grep -q 'FS_IOC_FSSETXATTR' "$RUNNER_TEMP/MediaProvider/jni/FuseDaemon.cpp"
          git -C "$RUNNER_TEMP/MediaProvider" diff -- jni/FuseDaemon.cpp > artifacts/android13-mediaprovider-projectid.patch
          test -s artifacts/android13-mediaprovider-projectid.patch
      - name: Build from immutable Build 30 baseline with all patches
        run: bash scripts/build_kernel.sh "$SOURCE_REF" "$BUILD_PROFILE"
      - name: Package Build 30 patched AnyKernel3 test ZIP
        env:
          AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK_DIR="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK_DIR"
          git -C "$AK_DIR" init
          git -C "$AK_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          cp scripts/anykernel_build30_eevdf.sh "$AK_DIR/anykernel.sh"
          cp artifacts/Image.gz-dtb artifacts/kernel.config artifacts/build-manifest.txt "$AK_DIR/"
          cp artifacts/meys-v1-eevdf-source.patch "$AK_DIR/"
          cp artifacts/scheduler-modes-audit.txt "$AK_DIR/"
          cp artifacts/storage-projectid-audit.txt artifacts/android-storage-audit.txt artifacts/eevdf-layer1-audit.txt "$AK_DIR/"
          cp artifacts/eevdf-audit.txt artifacts/modem-pm-audit.txt artifacts/modem-stack-audit.txt "$AK_DIR/"
          cp docs/scheduler-modes-port.md "$AK_DIR/SCHEDULER-MODES.txt"
          cp docs/modem-pm-port.md "$AK_DIR/MODEM-PM-PORT.txt"
          (
            cd "$AK_DIR"
            zip -r9 "$GITHUB_WORKSPACE/artifacts/Meys-Build30-EEVDF-Layer1-AnyKernel3.zip" META-INF tools LICENSE anykernel.sh Image.gz-dtb kernel.config build-manifest.txt meys-v1-eevdf-source.patch scheduler-modes-audit.txt storage-projectid-audit.txt android-storage-audit.txt eevdf-layer1-audit.txt eevdf-audit.txt modem-pm-audit.txt modem-stack-audit.txt SCHEDULER-MODES.txt MODEM-PM-PORT.txt
          )
          unzip -t "$GITHUB_WORKSPACE/artifacts/Meys-Build30-EEVDF-Layer1-AnyKernel3.zip"
          sha256sum artifacts/Meys-Build30-EEVDF-Layer1-AnyKernel3.zip | tee artifacts/EEVDF-SHA256.txt
      - name: Upload kernel image, ZIP and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: meys-build30-eevdf618-mt6781
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
