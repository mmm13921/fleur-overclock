name: Publish Build 123 to MEYS V5
on:
  push:
    branches:
      - meys-v116-eevdf-cleanup
    paths:
      - '.github/workflows/publish-meys-v5-build123.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Build 123 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          gh run download 46141012785 --repo mmm13921/fleur-overclock --name meys-build62-walt-full-mt6781 --dir artifacts
          test -s artifacts/MEYS-BUILD62-WALT-FULL-MT6781-AnyKernel3.zip
      - name: Verify and prepare Build 123 release assets
        run: |
          set -Eeuo pipefail
          unzip -t artifacts/MEYS-BUILD62-WALT-FULL-MT6781-AnyKernel3.zip
          cp artifacts/MEYS-BUILD62-WALT-FULL-MT6781-AnyKernel3.zip artifacts/MEYS-BUILD123-EEVDF-CLEANUP-MT6781-AnyKernel3.zip
          sha256sum artifacts/MEYS-BUILD123-EEVDF-CLEANUP-MT6781-AnyKernel3.zip | tee artifacts/MEYS-BUILD123-SHA256.txt
      - name: Publish Build 123 assets to existing MEYS V5 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meys-v5
          name: MEYS V5 — BUILD 123
          body: |
            MEYS V5 — Build 123 for Redmi Note 11S 4G (fleur / MT6781).

            Base: Fleux V12 / Build 62 lineage, based on the confirmed Build 116 baseline.
            Build 123 includes the EEVDF legacy CFS sysctl cleanup. The Build 123 GitHub Actions run completed successfully, and the device owner has confirmed that Build 123 boots.

            The previous Build 116 package is replaced by the Build 123 AnyKernel3 package. The ZIP is integrity-tested before publication; SHA-256 is provided alongside it. Keep a known-good boot image for recovery.
          files: |
            artifacts/MEYS-BUILD123-EEVDF-CLEANUP-MT6781-AnyKernel3.zip
            artifacts/MEYS-BUILD123-SHA256.txt
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Remove superseded Build 116 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete-asset meys-v5 MEYS-BUILD62-WALT-FULL-MT6781-AnyKernel3.zip --yes
          gh release delete-asset meys-v5 MEYS-BUILD116-SHA256.txt --yes
