name: Fleux full official 4.19.191 filesystem experiment
run-name: Full official 4.19.191 fs replacement (${{ github.event_name }})

on:
  push:
    branches: [experiment/full-official-fs-419191]
    paths:
      - .github/workflows/build-hyperos-full-fs.yml
      - scripts/build_kernel.sh
      - scripts/apply_full_official_419191_fs.py
      - scripts/audit_full_official_419191_fs.py
      - scripts/configure_hyperos_fs.sh
      - scripts/apply_modem_pm_compat.py
      - scripts/anykernel_hyperos_compat.sh
      - docs/full-official-fs-419191-experiment.md
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fleux source branch or tag
        required: true
        default: lineage-24.0
        type: string

permissions:
  contents: write

concurrency:
  group: fleux-full-official-fs-419191-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Replace complete fs tree, compile and package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'lineage-24.0' }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Validate source ref
        shell: bash
        run: |
          case "$SOURCE_REF" in
            ""|-*|*..*|*//*|*[!A-Za-z0-9._/-]*)
              echo "Invalid source ref: $SOURCE_REF" >&2
              exit 2
              ;;
          esac

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 python3-pip dwarves zip unzip

      - name: Install checksum-verified Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"

      - name: Build Fleux with complete official fs/ donor
        run: bash scripts/build_kernel.sh "$SOURCE_REF" hyperos-full-fs

      - name: Fetch pinned upstream AnyKernel3 framework
        env:
          AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK_DIR="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK_DIR"
          git -C "$AK_DIR" init
          git -C "$AK_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          cp scripts/anykernel_hyperos_compat.sh "$AK_DIR/anykernel.sh"
          cp artifacts/Image.gz-dtb "$AK_DIR/Image.gz-dtb"
          cp docs/full-official-fs-419191-experiment.md "$AK_DIR/FULL-OFFICIAL-FS-EXPERIMENT.txt"
          cp artifacts/kernel.config "$AK_DIR/kernel.config"
          cp artifacts/build-manifest.txt "$AK_DIR/build-manifest.txt"
          cp artifacts/hyperos-filesystem-audit.txt "$AK_DIR/hyperos-filesystem-audit.txt"
          cp artifacts/full-official-4.19.191-fs-audit.txt "$AK_DIR/full-official-4.19.191-fs-audit.txt"
          cp artifacts/full-official-4.19.191-fs-build-audit.txt "$AK_DIR/full-official-4.19.191-fs-build-audit.txt"
          cp artifacts/full-official-4.19.191-fs-source.patch "$AK_DIR/full-official-4.19.191-fs-source.patch"
          (
            cd "$AK_DIR"
            zip -r9 "$GITHUB_WORKSPACE/artifacts/Fleux-Full-Official-FS-4.19.191-AnyKernel3.zip" \
              META-INF tools LICENSE anykernel.sh Image.gz-dtb \
              FULL-OFFICIAL-FS-EXPERIMENT.txt kernel.config build-manifest.txt \
              hyperos-filesystem-audit.txt full-official-4.19.191-fs-audit.txt \
              full-official-4.19.191-fs-build-audit.txt full-official-4.19.191-fs-source.patch
          )
          unzip -t "$GITHUB_WORKSPACE/artifacts/Fleux-Full-Official-FS-4.19.191-AnyKernel3.zip"
          unzip -l "$GITHUB_WORKSPACE/artifacts/Fleux-Full-Official-FS-4.19.191-AnyKernel3.zip" \
            | grep -E 'META-INF/com/google/android/update-binary|tools/ak3-core.sh|anykernel.sh|Image.gz-dtb|LICENSE'
          sha256sum "$GITHUB_WORKSPACE/artifacts/Fleux-Full-Official-FS-4.19.191-AnyKernel3.zip" \
            | tee artifacts/FULL-OFFICIAL-FS-SHA256.txt

      - name: Publish isolated full-filesystem prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: hyperos-full-fs-419191-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          command -v gh
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Fleux experiment — complete official MT6781 fs/ 4.19.191" \
            --notes-file docs/full-official-fs-419191-experiment.md \
            --prerelease \
            artifacts/Fleux-Full-Official-FS-4.19.191-AnyKernel3.zip \
            artifacts/Image.gz-dtb \
            artifacts/kernel.config \
            artifacts/build-manifest.txt \
            artifacts/hyperos-filesystem-audit.txt \
            artifacts/full-official-4.19.191-fs-audit.txt \
            artifacts/full-official-4.19.191-fs-build-audit.txt \
            artifacts/full-official-4.19.191-fs-source.patch \
            artifacts/FULL-OFFICIAL-FS-SHA256.txt

      - name: Upload build outputs and audits
        uses: actions/upload-artifact@v4
        with:
          name: fleux-full-official-fs-4.19.191
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
