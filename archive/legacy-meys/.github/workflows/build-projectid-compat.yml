name: Fleux F2FS Project ID compatibility test
run-name: F2FS Project ID compatibility (${{ github.event_name }})
on:
  push:
    branches:
      - hmp-v2-projectid-compat-test
    paths:
      - '.github/workflows/build-projectid-compat.yml'
      - 'scripts/build_kernel.sh'
      - 'scripts/apply_f2fs_projectid_compat.py'
      - 'scripts/anykernel_storage_projectid.sh'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fleux-projectid-compat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-package:
    name: Build MT6781 F2FS Project ID compatibility kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: lineage-24.0
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 python3-pip dwarves zip unzip
      - name: Install checksum-verified Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"
      - name: Apply F2FS Project ID compatibility and build
        run: bash scripts/build_kernel.sh "$SOURCE_REF" storage-projectid
      - name: Fetch pinned upstream AnyKernel3 framework
        env:
          AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK_DIR="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK_DIR"
          git -C "$AK_DIR" init
          git -C "$AK_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          cp scripts/anykernel_storage_projectid.sh "$AK_DIR/anykernel.sh"
          cp artifacts/Image.gz-dtb "$AK_DIR/Image.gz-dtb"
          cp artifacts/kernel.config "$AK_DIR/kernel.config"
          cp artifacts/build-manifest.txt "$AK_DIR/build-manifest.txt"
          cp artifacts/storage-projectid-source.patch "$AK_DIR/storage-projectid-source.patch"
          cp artifacts/storage-projectid-audit.txt "$AK_DIR/storage-projectid-audit.txt"
          cp artifacts/official-4.19.191-fs-mount-audit.txt "$AK_DIR/official-4.19.191-fs-mount-audit.txt"
          (
            cd "$AK_DIR"
            zip -r9 "$GITHUB_WORKSPACE/artifacts/Fleux-F2FS-ProjectID-Compat-AnyKernel3.zip" \
              META-INF tools LICENSE anykernel.sh Image.gz-dtb kernel.config \
              build-manifest.txt storage-projectid-source.patch \
              storage-projectid-audit.txt official-4.19.191-fs-mount-audit.txt
          )
          unzip -t "$GITHUB_WORKSPACE/artifacts/Fleux-F2FS-ProjectID-Compat-AnyKernel3.zip"
          sha256sum "$GITHUB_WORKSPACE/artifacts/Fleux-F2FS-ProjectID-Compat-AnyKernel3.zip" | tee artifacts/STORAGE-PROJECTID-SHA256.txt
      - name: Upload kernel image, flashable ZIP, and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: fleux-f2fs-projectid-compat-mt6781
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: f2fs-projectid-compat-${{ github.run_number }}
          name: Fleux F2FS Project ID Compatibility — MT6781 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Experimental Fleux 4.19.325 kernel for Redmi Note 11S 4G / fleur / MT6781.

            F2FS compatibility behavior:
            - Keeps normal F2FS project quota accounting unchanged when the on-disk PRJQUOTA feature is enabled.
            - When PRJQUOTA is absent but per-inode EXTRA_ATTR can store i_projid, FS_IOC_FSSETXATTR stores the project ID and FSGETXATTR reports it.
            - This fallback tags inode project IDs only; it does not provide project quota accounting or enforcement.
            - Does not modify the /data superblock, fstab, mount flags, encryption, FUSE passthrough, or HMP scheduler implementation.

            Experimental test build. Boot and storage behavior require on-device validation. Keep a known-good boot image and recovery path.
          files: |
            artifacts/Fleux-F2FS-ProjectID-Compat-AnyKernel3.zip
            artifacts/storage-projectid-source.patch
            artifacts/storage-projectid-audit.txt
            artifacts/official-4.19.191-fs-mount-audit.txt
            artifacts/build-manifest.txt
            artifacts/STORAGE-PROJECTID-SHA256.txt
