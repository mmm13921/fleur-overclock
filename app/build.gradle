plugins { id 'com.android.application' }

android {
    namespace 'com.meysam.cputestasm'
    compileSdk 35
    defaultConfig {
        applicationId 'com.meysam.cputestasm'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0-asm'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-O3 -std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
